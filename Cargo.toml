[package]
name = "sailor"
version = "0.1.0"
authors = ["Noah Hüsser <yatekii@yatekii.ch>"]
edition = "2018"
resolver = "2"

description = "A sailing navigation application."
documentation = "https://docs.rs/sailor/"
homepage = "https://github.com/Yatekii/sailor"
repository = "https://github.com/Yatekii/sailor"
readme = "README.md"
categories = ["gui", "graphics", "rendering", "visualization", "science"]
keywords = ["sailing", "osm", "gps", "wgpu", "maps"]
license = "MIT OR Apache-2.0"

autobins = false

[lib]
name = "osm"
path = "src/lib/main.rs"

[[bin]]
name = "sailor"
path = "src/bin/main.rs"

[dependencies]
config = "0.14"
crossbeam-channel = "0.5"
log = { version = "0.4", features = ["serde"] }
lyon = { version = "1", path = "../lyon/crates/lyon" }
malloc_size_of_derive = "0.1"
nalgebra = "0.33"
nalgebra-glm = "0.19"
ncollide2d = "0.33"
nom = "7"
notify = "7"
once_cell = "1"
parity-util-mem = "0.12"
pollster = "0.4"
pretty_env_logger = "0.5"
quick-protobuf = "0.8"
serde = { version = "1", features = ["derive"] }
ureq = "2"
varint = "0.9"
wgpu = { version = "22", features = ["glsl"] }
glyphon = { version = "0.6" }
winit = "0.30"
egui = "0.29"
egui_wgpu_backend = "0.31"
egui_winit_platform = "0.24"
egui_demo_lib = "0.29"

[dev-dependencies]
insta = "1"

[profile.release]
debug = true
