[package]
name = "sailor"
version = "0.1.0"
authors = ["Noah Hüsser <yatekii@yatekii.ch>"]
edition = "2024"
resolver = "2"

description = "A sailing navigation application."
documentation = "https://docs.rs/sailor/"
homepage = "https://github.com/Yatekii/sailor"
repository = "https://github.com/Yatekii/sailor"
readme = "README.md"
categories = ["gui", "graphics", "rendering", "visualization", "science"]
keywords = ["sailing", "osm", "gps", "wgpu", "maps"]
license = "MIT OR Apache-2.0"

autobins = false

[lib]
name = "osm"
path = "src/lib/main.rs"

[[bin]]
name = "sailor"
path = "src/bin/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
config = "0.15"
log = { version = "0.4", features = ["serde"] }
# lyon = { version = "1", path = "../lyon/crates/lyon" }
lyon = { version = "1", git = "https://github.com/Yatekii/lyon.git" }
lru = "0.18"
malloc_size_of_derive = "0.1"
nalgebra = "0.35"
nalgebra-glm = "0.21"
parry2d = "0.30"
nom = "8"
nom-language = "0.1"
once_cell = "1"
parity-util-mem = "0.12"
pollster = "1"
pretty_env_logger = "0.5"
quick-protobuf = "0.8"
serde = { version = "1", features = ["derive"] }
varint = "0.9"
wgpu = { version = "30", features = ["glsl"] }
glyphon = "0.12"
winit = "0.30"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = { version = "0.36", default-features = false }
egui_tiles = "0.17"
egui_extras = { version = "0.36", features = ["syntect"] }
human_bytes = "0.4"
parking_lot = "0.12"

[dev-dependencies]
insta = "1"

# Tile fetching (ureq) and shader/css file-watching (notify) are native-only;
# on web these are replaced by the browser (fetch, no hot-reload).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "3"
notify = "8"
# clipboard (arboard) and wayland/x11 backends are native-only; on web egui uses
# the browser clipboard.
egui-winit = { version = "0.36", features = ["clipboard", "links", "wayland", "x11"] }

# getrandom (via config -> const-random) needs the js backend to build for wasm.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
debug = true
