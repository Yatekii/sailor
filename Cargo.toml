[package]
name = "sailor"
version = "0.1.0"
authors = ["Noah Hüsser <yatekii@yatekii.ch>"]
edition = "2024"
resolver = "2"

description = "A sailing navigation application."
documentation = "https://docs.rs/sailor/"
homepage = "https://github.com/Yatekii/sailor"
repository = "https://github.com/Yatekii/sailor"
readme = "README.md"
categories = ["gui", "graphics", "rendering", "visualization", "science"]
keywords = ["sailing", "osm", "gps", "wgpu", "maps"]
license = "MIT OR Apache-2.0"

autobins = false

[workspace]
members = ["crates/*"]

# Shared dependency versions, hoisted so every crate stays in lockstep.
[workspace.dependencies]
lyon = { version = "1", git = "https://github.com/Yatekii/lyon.git" }
nalgebra = "0.35"
nalgebra-glm = "0.21"
parry2d = "0.30"

[lib]
name = "osm"
path = "src/lib/main.rs"

[[bin]]
name = "sailor"
path = "src/bin/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
config = "0.15"
log = { version = "0.4", features = ["serde"] }
sailor-math = { path = "crates/math" }
sailor-platform = { path = "crates/platform" }
sailor-style = { path = "crates/style" }
lyon = { workspace = true }
lru = "0.18"
# heap-size estimation for the debug stats; wasm-friendly, unlike parity-util-mem.
deepsize = "0.2"
nalgebra = { workspace = true }
nalgebra-glm = { workspace = true }
parry2d = { workspace = true }
nom = "8"
nom-language = "0.1"
once_cell = "1"
pollster = "1"
quick-protobuf = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gribberish = "1"
varint = "0.9"
wgpu = { version = "30", features = ["glsl"] }
glyphon = "0.12"
winit = "0.30"
egui = "0.36"
egui-wgpu = "0.36"
egui_tiles = "0.17"
egui_extras = { version = "0.36", features = ["syntect"] }
# cross-platform async http: native uses hyper/tokio, web uses the browser fetch.
reqwest = { version = "0.12", default-features = false }
# spawned-task handles (RemoteHandle) and a portable clock that works on wasm.
futures = "0.3"
web-time = "1"
human_bytes = "0.4"
parking_lot = "0.12"

[dev-dependencies]
insta = { version = "1", features = ["glob"] }

# Shader/css file-watching (notify) is native-only; on web there is no hot-reload.
# Native reqwest needs a TLS backend and a tokio runtime to drive its futures;
# on web reqwest uses the browser fetch and tasks run on the event loop.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify = "8"
reqwest = { version = "0.12", features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
pretty_env_logger = "0.5"
# egui-winit (winit<->egui input bridge) is native-only; the web build uses a
# manual winit->egui input shim instead.
egui-winit = "0.36"

# getrandom (via config -> const-random) needs the js backend to build for wasm.
# wasm-bindgen-futures drives spawned tasks on the browser event loop.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
web-sys = { version = "0.3", features = ["Window", "Location"] }

[profile.release]
debug = true
